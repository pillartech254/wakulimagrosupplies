name: Build Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "android/**"
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "assets/**"
      - "icons/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sync web assets into Android assets folder
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js android/app/src/main/assets/
          rm -rf android/app/src/main/assets/assets android/app/src/main/assets/icons
          cp -r assets android/app/src/main/assets/assets
          cp -r icons android/app/src/main/assets/icons

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillarPOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
